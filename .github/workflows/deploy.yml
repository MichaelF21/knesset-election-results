name: Build and deploy

on:
  push:
    branches: [main]
    # raw committee CSVs alone don't change the site; the regenerated site/public/data does
    paths: ['site/**', 'data/**', '!data/raw/k26/**', 'pipeline/**', 'scripts/**', 'tests/**', 'requirements.txt', '.github/workflows/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # when called after an ingest commit, build the new commit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      # live election-night updates (scripts/live.py) are validated before they are pushed;
      # skip the test suites for them so results publish faster
      - if: ${{ !startsWith(github.event.head_commit.message, 'Live update') }}
        run: pip install -r requirements.txt
      - if: ${{ !startsWith(github.event.head_commit.message, 'Live update') }}
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - working-directory: site
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          npm ci
          case "$COMMIT_MSG" in "Live update"*) ;; *) npm test ;; esac
          npm run build
      - name: Refuse to deploy mock data
        run: |
          test ! -e site/dist/mock-data
          ! grep -q '"mock":true' site/dist/data/meta.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
