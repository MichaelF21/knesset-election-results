# Party colors, keyed by election and ballot letter (letters are reused across elections).
# Each starts from the party's real color (Wikipedia's party-color data, which follows the parties'
# branding) and is moved only as much as needed so that parties whose units touch on the map stay
# distinguishable, also for color-blind viewers. Proposed by scripts/tune_colors.py (targets and
# rules are there), checked by tests/test_colors.py. A continuing party keeps its 2022 color.
# Lists not named here get a neutral grey.
